# ============================================================================
# Configuration Gitleaks — Secret Scanning du pipeline CI
# ============================================================================
# Aucun secret applicatif n'est versionné : ils vivent dans Vault et sont
# matérialisés dans Kubernetes par scripts/sync-k8s-secrets.ps1.
# Seule exception : alertmanager-secret.yaml, qui ne contient que des valeurs
# de remplacement (REPLACE_ME). Tout secret détecté bloque le build.
# ============================================================================

[extend]
useDefault = true

[allowlist]
description = "Artefacts de build + gabarit Alertmanager à valeurs de remplacement"
paths = [
  '''node_modules''',
  '''coverage''',
  '''dist''',
  '''package-lock\.json''',
  '''kubernetes/manifests/monitoring/alertmanager-secret\.yaml''',
]
