# ============================================================
# Nginx Configuration
# ============================================================
# Nginx = serveur web qui va servir la React app

worker_processes auto;
error_log /var/log/nginx/error.log warn;
# /tmp : seul répertoire inscriptible quand la racine est en lecture seule
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Fichiers temporaires hors de la racine (readOnlyRootFilesystem)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Ne pas divulguer la version de nginx
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json;

    # Server block
    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # En-têtes de sécurité. nginx n'hérite pas des add_header du niveau
        # supérieur dès qu'un bloc location en déclare : on les réinclut.
        include /etc/nginx/security-headers.conf;

        # Serve static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # Proxy API calls to backend (covers relative /api/* fetch calls)
        location /api {
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # SPA routing - redirect all routes to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
